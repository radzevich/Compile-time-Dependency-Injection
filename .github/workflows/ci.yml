name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu with GCC
          - os: ubuntu-latest
            build_type: Release
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            build_type: Debug
            c_compiler: gcc
            cpp_compiler: g++
          # Ubuntu with Clang
          - os: ubuntu-latest
            build_type: Release
            c_compiler: clang
            cpp_compiler: clang++
          - os: ubuntu-latest
            build_type: Debug
            c_compiler: clang
            cpp_compiler: clang++
          # macOS with Clang
          - os: macos-latest
            build_type: Release
            c_compiler: clang
            cpp_compiler: clang++
          - os: macos-latest
            build_type: Debug
            c_compiler: clang
            cpp_compiler: clang++
          # Windows with MSVC
          - os: windows-latest
            build_type: Release
            c_compiler: cl
            cpp_compiler: cl
          - os: windows-latest
            build_type: Debug
            c_compiler: cl
            cpp_compiler: cl

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake (Unix)
      if: runner.os != 'Windows'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DIOC_BUILD_EXAMPLES=OFF
        -DIOC_BUILD_TESTS=ON
        -S ${{ github.workspace }}

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DIOC_BUILD_EXAMPLES=OFF
        -DIOC_BUILD_TESTS=ON
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config ${{ matrix.build_type }} --output-on-failure --verbose

    # Run a basic functionality test using the IOC example that we know works
    - name: Run basic example (Unix)
      if: runner.os != 'Windows'
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: |
        # Build a simple test that uses the IOC library
        cat > basic_test.cpp << 'EOF'
        #include <ioc/ioc.hpp>
        #include <iostream>
        
        struct TestDescriptor {};
        class TestService {
        public:
            int getValue() const { return 42; }
        };
        
        template<>
        struct IOC::Binding<TestDescriptor> {
            using TLifetime = IOC::Transient;
            using TService = TestService;
        };
        
        int main() {
            IOC::Container<TestDescriptor> container;
            auto service = container.Resolve<TestDescriptor>();
            std::cout << "IOC Library works! Value: " << service.getValue() << std::endl;
            return service.getValue() == 42 ? 0 : 1;
        }
        EOF
        if [ "${{ matrix.c_compiler }}" = "gcc" ]; then
          g++ -std=c++20 -I ../include -o basic_test basic_test.cpp
        else
          clang++ -std=c++20 -I ../include -o basic_test basic_test.cpp
        fi
        ./basic_test

    - name: Run basic example (Windows)
      if: runner.os == 'Windows'
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: |
        echo '#include <ioc/ioc.hpp>' > basic_test.cpp
        echo '#include <iostream>' >> basic_test.cpp
        echo 'struct TestDescriptor {};' >> basic_test.cpp
        echo 'class TestService { public: int getValue() const { return 42; } };' >> basic_test.cpp
        echo 'template<> struct IOC::Binding<TestDescriptor> { using TLifetime = IOC::Transient; using TService = TestService; };' >> basic_test.cpp
        echo 'int main() { IOC::Container<TestDescriptor> container; auto service = container.Resolve<TestDescriptor>(); std::cout << "IOC Library works! Value: " << service.getValue() << std::endl; return service.getValue() == 42 ? 0 : 1; }' >> basic_test.cpp
        cl /EHsc /std:c++20 /I..\include basic_test.cpp /Fe:basic_test.exe
        basic_test.exe

  # Separate job for code coverage (only on Ubuntu with GCC)
  coverage:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y lcov
    
    - name: Configure CMake with coverage
      run: >
        cmake -B build
        -DCMAKE_CXX_COMPILER=g++
        -DCMAKE_C_COMPILER=gcc
        -DCMAKE_BUILD_TYPE=Debug
        -DCMAKE_CXX_FLAGS="--coverage"
        -DCMAKE_C_FLAGS="--coverage"
        -DIOC_BUILD_EXAMPLES=OFF
        -DIOC_BUILD_TESTS=ON
        -S .

    - name: Build with coverage
      run: cmake --build build --config Debug

    - name: Run tests
      working-directory: build
      run: |
        ./tests/ioc_tests || echo "Tests completed with expected failures"
        
    - name: Generate coverage report
      run: |
        lcov --directory build --capture --output-file coverage.info
        lcov --remove coverage.info '/usr/*' '*/tests/*' --output-file coverage.info
        lcov --list coverage.info

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false